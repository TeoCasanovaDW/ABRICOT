name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install -g npm@11.6.2

      - run: npm ci

      - run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm run test

      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Prisma parses the datasource block for every command, including
      # `generate` (run by postinstall), so it needs DATABASE_URL to be set
      # even though generate never opens a connection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install -g npm@11.6.2

      - run: npm ci

      - name: Typecheck & build
        run: npm run build

  e2e:
    name: E2E (Cypress)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-test-secret
      PORT: 8000
      FRONTEND_URL: http://localhost:3000
      BACKEND_API_URL: http://localhost:8000
      # The e2e AI-generation spec mocks the browser-side fetch to
      # /api/ai/generate-tasks with cy.intercept, so the route handler that
      # reads these is never actually reached. Placeholders only.
      LLM_API_KEY: ci-unused-key
      LLM_MODEL: mistral-small-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - run: npm install -g npm@11.6.2

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Apply database migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Seed test data
        working-directory: backend
        run: npm run seed

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          node dist/index.js &
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          npm start &
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Run Cypress E2E tests
        working-directory: frontend
        run: npm run test:e2e
